<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformation Visualizer</title>
<style>
  :root{
    --blue:#2563eb; --red:#dc2626; --ink:#172033; --muted:#64748b;
    --panel:#ffffff; --bg:#f4f7fb; --line:#dbe3ef; --accent:#eef4ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);text-align:center}
  h1{font-size:22px;margin:0}
  .top-actions{display:flex;gap:8px}
  button{border:1px solid #cbd5e1;background:#fff;color:var(--ink);border-radius:8px;padding:9px 13px;font-weight:650;cursor:pointer}
  button:hover{background:#f8fafc}
  button.primary{background:#172033;color:#fff;border-color:#172033}
  button.danger{color:#b91c1c}
  main{max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(350px,.85fr);gap:18px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:0 2px 8px rgba(15,23,42,.04)}
  .left{padding:14px}
  .canvas-wrap{position:relative;height:610px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .canvas-help{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);padding:7px 9px;border-radius:7px;font-size:12px;color:var(--muted);pointer-events:none}
  .button-group{display:flex;gap:8px;margin-top:12px}
  .data-grid{display:block;margin-top:0}
  .mini{padding:12px;border:1px solid var(--line);border-radius:10px}
  .mini h3{margin:0 0 8px;font-size:14px}
  .coordinate-scroll{height:190px;overflow-y:auto;border:1px solid #edf1f6;border-radius:7px}
  .coordinate-scroll table{width:100%;border-collapse:collapse;font-size:13px}
  .coordinate-scroll thead th{position:sticky;top:0;background:#fff;z-index:1;box-shadow:0 1px 0 #edf1f6}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 7px;border-bottom:1px solid #edf1f6}
  th{color:var(--muted);font-weight:700}
  .rule{margin-top:12px;padding:12px;border-radius:10px;background:#f8fafc;border:1px solid var(--line)}
  .rule-title{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}
  .rule-value{font-size:18px;font-weight:750}
  .coordinate-rule-panel{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fafcff}
  .coordinate-rule-value{font-size:18px;font-weight:750;line-height:1.8;text-align:center}
  .frac{display:inline-block;vertical-align:middle;text-align:center;font-size:0.9em;line-height:1}
  .frac > span{display:block;padding:0.1em}
  .frac .numerator{border-bottom:1px solid currentColor;padding-bottom:0.2em}
  .frac .denominator{padding-top:0.2em}
  .right{padding:14px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 110px);overflow:auto;position:sticky;top:12px}
  .transform-list{display:flex;flex-direction:column;gap:8px}
  .transform{border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff}
  .transform.dragging{opacity:.45}
  .transform-head{display:flex;align-items:center;gap:7px;min-height:34px}
  .handle{cursor:grab;color:#94a3b8;font-size:17px;user-select:none}
  .transform-name{font-size:13px;font-weight:750;flex:1;whitespace:nowrap}
  .clear{padding:4px 7px;font-size:11px}
  .control{margin:0;display:flex;align-items:center;gap:5px;flex:0 0 170px}
  .control input[type=number], .control input[type=text], select{width:100%;min-width:0;border:1px solid #cbd5e1;border-radius:7px;padding:6px 7px;background:#fff;font:inherit}
  .step{width:34px;height:34px;padding:0;font-size:17px}
  .checkrow{display:flex;gap:12px;align-items:center;margin:0 0 0 auto;font-size:13px}
  .checkrow label{display:flex;gap:6px;align-items:center}
  .hint{font-size:11px;color:var(--muted);margin-top:5px}
  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#64748b;font-weight:800;margin-top:3px}
  .section-subtitle{font-size:13px;color:var(--muted);margin-top:4px;margin-bottom:8px}
  @media(max-width:1050px){
    main{grid-template-columns:1fr}
    .right{max-height:none;position:static}
  }
  @media(max-width:520px){
    .transform-head{flex-wrap:wrap}
    .transform-name{white-space:normal}
    .control{flex:1 1 150px}
  }
  @media(max-width:700px){
    main{padding:8px}
    .canvas-wrap{height:500px}
  }
</style>
</head>
<body>
<header>
  <h1>Transformation Visualizer</h1>
</header>

<main>
  <section class="card left">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="graph"></canvas>
      <div class="canvas-help" id="canvasHelp">Click or tap to add points to create your shape.</div>
    </div>
    <div class="button-group">
      <button id="resetTransforms" class="primary">Reset Transformations</button>
      <button id="resetShape" class="danger">Reset Shape</button>
    </div>
  </section>

  <aside class="card right">
    <div class="section-subtitle">Drag to change the order of transformations.</div>
    <div class="transform-list" id="transformList"></div>

    <div class="coordinate-rule-panel" id="coordinateRulePanel">
      <div class="section-title">Coordinate Rule</div>
      <div class="coordinate-rule-value" id="coordinateRule">(x, y) → (x, y)</div>
    </div>

    <div class="data-grid">
      <div class="mini">
        <h3>Coordinates</h3>
        <div class="coordinate-scroll" id="coordinateTable"></div>
      </div>
    </div>
  </aside>
</main>

<script>
(() => {
  const canvas = document.getElementById('graph');
  const wrap = document.getElementById('canvasWrap');
  const ctx = canvas.getContext('2d');
  const coordinateTable = document.getElementById('coordinateTable');
  const coordinatePanel = document.querySelector('.data-grid');
  const list = document.getElementById('transformList');
  const coordinateRulePanel = document.getElementById('coordinateRulePanel');
  const coordinateRuleEl = document.getElementById('coordinateRule');

  let points = [];
  let view = {cx:0, cy:0, scale:42};
  let lastPointer = null;
  let pointerMoved = false;
  let drawingPointerId = null;

  const transforms = [
    {id:'x', name:'Horizontal translation', type:'translationX', value:0},
    {id:'y', name:'Vertical translation', type:'translationY', value:0},
    {id:'d', name:'Dilation / contraction', type:'dilation', value:'1'},
    {id:'rx', name:'Reflection over X-axis', type:'reflectX', value:false},
    {id:'ry', name:'Reflection over Y-axis', type:'reflectY', value:false},
    {id:'r', name:'Rotation', type:'rotation', value:0}
  ];

  function resizeCanvas(){
    const dpr = window.devicePixelRatio || 1;
    canvas.width = wrap.clientWidth*dpr;
    canvas.height = wrap.clientHeight*dpr;
    canvas.style.width = wrap.clientWidth+'px';
    canvas.style.height = wrap.clientHeight+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }
  window.addEventListener('resize', resizeCanvas);

  function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){[a,b]=[b,a%b]} return a||1; }
  function parseFraction(s){
    s=String(s).trim();
    if(!s) return 1;
    if(s.includes('/')){
      const [a,b]=s.split('/').map(Number);
      if(Number.isFinite(a)&&Number.isFinite(b)&&b!==0) return a/b;
    }
    const n=Number(s);
    return Number.isFinite(n) ? n : NaN;
  }
  
  // Rational number class to preserve exact fractions through calculations
  class Rational {
    constructor(num, den = 1) {
      if(den === 0) throw new Error("Denominator cannot be zero");
      const g = gcd(Math.abs(num), Math.abs(den));
      this.num = num / g;
      this.den = den / g;
      if(this.den < 0) {
        this.num = -this.num;
        this.den = -this.den;
      }
    }
    
    add(other) {
      if(typeof other === 'number') other = new Rational(other);
      return new Rational(this.num * other.den + other.num * this.den, this.den * other.den);
    }
    
    multiply(other) {
      if(typeof other === 'number') other = new Rational(other);
      return new Rational(this.num * other.num, this.den * other.den);
    }
    
    toNumber() {
      return this.num / this.den;
    }
    
    toString() {
      if(this.den === 1) return String(this.num);
      return `${this.num}/${this.den}`;
    }
    
    toFractionObject() {
      if(this.den === 1) return String(this.num);
      return {num: this.num, den: this.den};
    }
  }
  
  // Convert number to fraction string (improper form for coordinate rule display)
  function toFractionString(n, maxDenominator = 10000){
    if(!Number.isFinite(n)) return 'undefined';
    if(Math.abs(n)<1e-10) return '0';
    const rounded=Math.round(n*1000000)/1000000;
    if(Number.isInteger(rounded)) return String(rounded);
    
    let sign=rounded<0?-1:1;
    let x=Math.abs(rounded);
    
    // Try to find a fraction representation
    for(let den=1;den<=maxDenominator;den++){
      const num=Math.round(x*den);
      if(Math.abs(x-num/den)<1e-9){
        const g=gcd(num,den);
        const finalNum = sign*num/g;
        const finalDen = den/g;
        if(finalDen === 1) return String(finalNum);
        return {num: finalNum, den: finalDen};
      }
    }
    return String(rounded);
  }
  
  // Format as stacked HTML fraction
  function formatStackedFraction(fracObj){
    if(typeof fracObj === 'string' || typeof fracObj === 'number'){
      return String(fracObj);
    }
    return `<span class="frac"><span class="numerator">${fracObj.num}</span><span class="denominator">${fracObj.den}</span></span>`;
  }
  
  function frac(n){
    const result = toFractionString(n);
    if(typeof result === 'object'){
      return result.num + '/' + result.den;
    }
    return result;
  }
  
  function signedTerm(v, variable){
    if(Math.abs(v)<1e-10) return '';
    const sign=v<0?'−':'+';
    const a=Math.abs(v);
    return ` ${sign} ${frac(a)}${variable}`;
  }

  function applyPoint(p){
    let x=p.x,y=p.y;
    for(const t of transforms){
      if(t.type==='translationX') x += Number(t.value)||0;
      else if(t.type==='translationY') y += Number(t.value)||0;
      else if(t.type==='dilation'){ const k=parseFraction(t.value); if(Number.isFinite(k)){x*=k;y*=k;} }
      else if(t.type==='reflectX') { if(t.value) y=-y; }
      else if(t.type==='reflectY') { if(t.value) x=-x; }
      else if(t.type==='rotation'){
        const r=((Number(t.value)||0)%360+360)%360;
        if(r===90) [x,y]=[-y,x];
        else if(r===180) [x,y]=[-x,-y];
        else if(r===270) [x,y]=[y,-x];
      }
    }
    return {x,y};
  }

  function pipeline(){
    let a=new Rational(1), b=new Rational(0), c=new Rational(0), d=new Rational(1), tx=new Rational(0), ty=new Rational(0);
    
    for(const t of transforms){
      let A=new Rational(1), B=new Rational(0), C=new Rational(0), D=new Rational(1), X=new Rational(0), Y=new Rational(0);
      
      if(t.type==='translationX') X=new Rational(Number(t.value)||0);
      if(t.type==='translationY') Y=new Rational(Number(t.value)||0);
      if(t.type==='dilation'){
        const val = String(t.value).trim();
        if(val.includes('/')){
          const [num, den] = val.split('/').map(Number);
          if(Number.isFinite(num) && Number.isFinite(den) && den !== 0){
            A = D = new Rational(num, den);
          }
        } else {
          const k = Number(val);
          if(Number.isFinite(k)) A = D = new Rational(k);
        }
      }
      if(t.type==='reflectX') { if(t.value) D=new Rational(-1); }
      if(t.type==='reflectY') { if(t.value) A=new Rational(-1); }
      if(t.type==='rotation'){
        const r=((Number(t.value)||0)%360+360)%360;
        if(r===90){A=new Rational(0);B=new Rational(-1);C=new Rational(1);D=new Rational(0)}
        if(r===180){A=new Rational(-1);D=new Rational(-1)}
        if(r===270){A=new Rational(0);B=new Rational(1);C=new Rational(-1);D=new Rational(0)}
      }
      
      const na=A.multiply(a).add(B.multiply(c));
      const nb=A.multiply(b).add(B.multiply(d));
      const nc=C.multiply(a).add(D.multiply(c));
      const nd=C.multiply(b).add(D.multiply(d));
      const ntx=A.multiply(tx).add(B.multiply(ty)).add(X);
      const nty=C.multiply(tx).add(D.multiply(ty)).add(Y);
      
      a=na;b=nb;c=nc;d=nd;tx=ntx;ty=nty;
    }
    return {a,b,c,d,tx,ty};
  }

  function formatRuleCoefficient(rational){
    return rational.toFractionObject();
  }

  function affineExpression(xCoeff, yCoeff, constant){
    const terms=[];
    const addTerm=(coeff, variable)=>{
      if(Math.abs(coeff.toNumber())<1e-10) return;
      const negative=coeff.toNumber()<0;
      const abs=coeff.toNumber()<0 ? coeff.multiply(-1) : coeff;
      const coeffFrac = formatRuleCoefficient(abs);
      
      let coeffText = '';
      if(typeof coeffFrac === 'object'){
        // It's a fraction
        if(variable && Math.abs(abs.toNumber()-1)<1e-10){
          coeffText = '';
        } else {
          coeffText = formatStackedFraction(coeffFrac);
        }
      } else {
        // It's a whole number or string
        if(Math.abs(abs.toNumber()-1)<1e-10 && variable){
          coeffText = '';
        } else {
          coeffText = String(coeffFrac);
        }
      }
      
      const body=coeffText+variable;
      terms.push({negative, body});
    };
    
    addTerm(xCoeff,'x');
    addTerm(yCoeff,'y');
    
    if(Math.abs(constant.toNumber())>=1e-10){
      const isNegative = constant.toNumber() < 0;
      const absConstant = isNegative ? constant.multiply(-1) : constant;
      const constFrac = formatRuleCoefficient(absConstant);
      const constBody = typeof constFrac === 'object' ? formatStackedFraction(constFrac) : String(constFrac);
      terms.push({negative:isNegative, body:constBody});
    }
    
    if(!terms.length) return '0';
    
    return terms.map((t,i)=>{
      const sign=t.negative?'−':'+';
      return i===0 ? (t.negative?'−':'')+t.body : ` ${sign} ${t.body}`;
    }).join('');
  }

  function ruleString(){
    const p=pipeline();
    return `(x, y) → (${affineExpression(p.a,p.b,p.tx)}, ${affineExpression(p.c,p.d,p.ty)})`;
  }

  function coordinateTables(){
    if(points.length===0){
      coordinateTable.innerHTML='<div class="hint">No points yet.</div>';
      return;
    }
    const head='<table><thead><tr><th>#</th><th colspan="2">Original</th><th colspan="2">Transformed</th></tr><tr><th></th><th>x</th><th>y</th><th>x</th><th>y</th></tr></thead><tbody>';
    coordinateTable.innerHTML=head+points.map((p,i)=>{const q=applyPoint(p);return `<tr><td>${i+1}</td><td>${p.x.toFixed(3)}</td><td>${p.y.toFixed(3)}</td><td>${q.x.toFixed(3)}</td><td>${q.y.toFixed(3)}</td></tr>`}).join('')+'</tbody></table>';
  }

  function worldToScreen(p){
    return {x:canvas.clientWidth/2+(p.x-view.cx)*view.scale, y:canvas.clientHeight/2-(p.y-view.cy)*view.scale};
  }
  function screenToWorld(x,y){
    return {x:(x-canvas.clientWidth/2)/view.scale+view.cx, y:(canvas.clientHeight/2-y)/view.scale+view.cy};
  }

  function drawGrid(){
    const w=canvas.clientWidth,h=canvas.clientHeight;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
    const minor=view.scale>=25 ? 1 : (view.scale>=12?2:5);
    const left=screenToWorld(0,h).x, right=screenToWorld(w,0).x;
    const bottom=screenToWorld(0,h).y, top=screenToWorld(w,0).y;
    ctx.lineWidth=1; ctx.strokeStyle='#edf1f6';
    for(let x=Math.floor(left/minor)*minor;x<=right;x+=minor){
      const sx=worldToScreen({x,y:0}).x; ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,h);ctx.stroke();
    }
    for(let y=Math.floor(bottom/minor)*minor;y<=top;y+=minor){
      const sy=worldToScreen({x:0,y}).y; ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(w,sy);ctx.stroke();
    }
    const x0=worldToScreen({x:0,y:0}).x, y0=worldToScreen({x:0,y:0}).y;
    ctx.strokeStyle='#64748b';ctx.lineWidth=1.5;
    if(x0>=0&&x0<=w){ctx.beginPath();ctx.moveTo(x0,0);ctx.lineTo(x0,h);ctx.stroke()}
    if(y0>=0&&y0<=h){ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(w,y0);ctx.stroke()}
    ctx.fillStyle='#64748b';ctx.font='11px system-ui';
    const labelStep=view.scale>28?1:view.scale>14?2:5;
    for(let x=Math.ceil(left/labelStep)*labelStep;x<=right;x+=labelStep){
      if(Math.abs(x)<1e-9) continue;
      const sx=worldToScreen({x,y:0}).x;
      if(sx>20&&sx<w-20) ctx.fillText(x,sx+3,Math.min(h-5,Math.max(14,y0+15)));
    }
    for(let y=Math.ceil(bottom/labelStep)*labelStep;y<=top;y+=labelStep){
      if(Math.abs(y)<1e-9) continue;
      const sy=worldToScreen({x:0,y}).y;
      if(sy>15&&sy<h-10) ctx.fillText(y,Math.min(w-25,Math.max(3,x0+6)),sy-3);
    }
  }

  function drawPolyline(arr, stroke, fill, width=2.5){
    if(arr.length<2)return;
    ctx.beginPath();
    arr.forEach((p,i)=>{const s=worldToScreen(p); if(i===0)ctx.moveTo(s.x,s.y);else ctx.lineTo(s.x,s.y)});
    ctx.closePath();
    ctx.fillStyle=fill;ctx.fill();
    ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();
  }

  function draw(){
    drawGrid();
    if(points.length){
      // Enable multiply blend mode for overlapping colors
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      
      // Draw original shape (lines and fill only if 3+ points)
      if(points.length >= 3) {
        drawPolyline(points,'#2563eb','rgba(37,99,235,.10)',3);
      } else if(points.length === 2) {
        // Draw just a line between two points
        ctx.strokeStyle='#2563eb';
        ctx.lineWidth=3;
        ctx.beginPath();
        const s1=worldToScreen(points[0]);
        const s2=worldToScreen(points[1]);
        ctx.moveTo(s1.x,s1.y);
        ctx.lineTo(s2.x,s2.y);
        ctx.stroke();
      }
      
      // Draw transformed points (always, even with just 1 point)
      const transformed=points.map(applyPoint);
      
      // Draw transformed shape (lines and fill only if 3+ points)
      if(transformed.length >= 3) {
        drawPolyline(transformed,'#dc2626','rgba(220,38,38,.10)',3);
      } else if(transformed.length === 2) {
        // Draw just a line between two transformed points
        ctx.strokeStyle='#dc2626';
        ctx.lineWidth=3;
        ctx.beginPath();
        const s1=worldToScreen(transformed[0]);
        const s2=worldToScreen(transformed[1]);
        ctx.moveTo(s1.x,s1.y);
        ctx.lineTo(s2.x,s2.y);
        ctx.stroke();
      }
      
      ctx.restore();
      
      // Draw points with normal blending (on top, so they're always visible)
      ctx.globalCompositeOperation = 'source-over';
      
      // Draw original points
      points.forEach(p=>{
        const s=worldToScreen(p);
        ctx.fillStyle='#2563eb';
        ctx.beginPath();
        ctx.arc(s.x,s.y,5,0,Math.PI*2);
        ctx.fill();
      });
      
      // Draw transformed points with multiply blend to show purple overlap
      ctx.globalCompositeOperation = 'multiply';
      transformed.forEach(p=>{
        const s=worldToScreen(p);
        ctx.fillStyle='#dc2626';
        ctx.beginPath();
        ctx.arc(s.x,s.y,4,0,Math.PI*2);
        ctx.fill();
      });
      
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function renderControls(){
    list.innerHTML='';
    transforms.forEach((t,index)=>{
      const el=document.createElement('div'); el.className='transform';el.draggable=true;el.dataset.id=t.id;
      let control='';
      if(t.type==='translationX'||t.type==='translationY'){
        control=`<div class="control"><button class="step minus">−</button><input type="number" step="1" value="${t.value}"><button class="step plus">+</button></div>`;
      } else if(t.type==='dilation'){
        control=`<div class="control"><button class="step minus">−</button><input title="Integer, decimal, or fraction" type="text" inputmode="decimal" value="${t.value}"><button class="step plus">+</button></div>`;
      } else if(t.type==='rotation'){
        control=`<div class="control">
          <button class="step rotation-minus" type="button">−</button>
          <span class="rotation-value" style="min-width:52px;text-align:center;font-weight:700">${t.value}°</span>
          <button class="step rotation-plus" type="button">+</button>
        </div>`;
      } else {
        control=`<div class="checkrow"><label><input type="checkbox" ${t.value?'checked':''}></label></div>`;
      }
      const clearButton = (t.type==='translationX'||t.type==='translationY'||t.type==='dilation'||t.type==='rotation')
        ? '<button class="clear">Clear</button>' : '';
      el.innerHTML = '<div class="transform-head"><span class="handle">☷</span><span class="transform-name">'
        + t.name + '</span>' + control + clearButton + '</div>';
      list.appendChild(el);

      const input=el.querySelector('input[type=number], input[type=text]');
      if(input){
        input.addEventListener('input',()=>{t.value=input.value; update();});
        el.querySelector('.minus').onclick=()=>stepTransform(t,-1);
        el.querySelector('.plus').onclick=()=>stepTransform(t,1);
      }
      const check=el.querySelector('input[type=checkbox]');
      if(check) check.onchange=()=>{t.value=check.checked;update()};
      const rotationMinus = el.querySelector('.rotation-minus');
      const rotationPlus = el.querySelector('.rotation-plus');
      if(rotationMinus){
        rotationMinus.onclick=()=>{
          const values=[0,90,180,270];
          let i=values.indexOf(Number(t.value));
          if(i<0)i=0;
          t.value=values[(i-1+values.length)%values.length];
          renderControls();
          update();
        };
      }
      if(rotationPlus){
        rotationPlus.onclick=()=>{
          const values=[0,90,180,270];
          let i=values.indexOf(Number(t.value));
          if(i<0)i=0;
          t.value=values[(i+1)%values.length];
          renderControls();
          update();
        };
      }
      const clearBtn = el.querySelector('.clear');
      if (clearBtn) {
        clearBtn.onclick=()=>{
          if(t.type==='translationX'||t.type==='translationY')t.value=0;
          if(t.type==='dilation')t.value='1';
          if(t.type==='rotation')t.value=0;
          renderControls();
          update();
        };
      }
      el.addEventListener('dragstart',()=>{el.classList.add('dragging');});
      el.addEventListener('dragend',()=>{el.classList.remove('dragging');});
    });
    list.querySelectorAll('.transform').forEach(el=>{
      el.addEventListener('dragover',e=>{e.preventDefault();const dragging=list.querySelector('.dragging');if(!dragging||dragging===el)return;const rect=el.getBoundingClientRect();list.insertBefore(dragging,e.clientY<rect.top+rect.height/2?el:el.nextSibling);});
      el.addEventListener('drop',()=>{const ids=[...list.children].map(x=>x.dataset.id);transforms.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));renderControls();update();});
    });
  }

  function stepTransform(t,dir){
    if(t.type==='translationX'||t.type==='translationY'){
      t.value=(Number(t.value)||0)+dir; renderControls();update(); return;
    }
    if(t.type==='dilation'){
      let n=parseFraction(t.value);
      if(!Number.isFinite(n) || n<=0)n=1;

      if(dir>0){
        if(n < 1){
          const den=Math.round(1/n);
          t.value = den <= 2 ? '1' : `1/${den-1}`;
        } else {
          t.value = String(Math.floor(n)+1);
        }
      } else {
        if(n > 1){
          const whole=Math.floor(n);
          t.value = whole <= 2 ? '1/2' : String(whole-1);
        } else if(Math.abs(n-1)<1e-10) {
          t.value = '1/2';
        } else {
          const den=Math.round(1/n);
          t.value = `1/${den+1}`;
        }
      }
      renderControls();
      update();
    }
  }

  function update(){
    coordinateTables();
    const rule=ruleString();
    coordinateRuleEl.innerHTML=rule;
    draw();
  }

  document.getElementById('resetTransforms').onclick=()=>{
    transforms.forEach(t=>{
      if(t.type==='translationX'||t.type==='translationY')t.value=0;
      if(t.type==='dilation')t.value='1';
      if(t.type==='rotation')t.value=0;
      if(t.type==='reflectX'||t.type==='reflectY')t.value=false;
    });
    renderControls();update();
  };
  document.getElementById('resetShape').onclick=()=>{
    points=[];view={cx:0,cy:0,scale:42};update();
  };

  function addShapePointFromEvent(e){
    const r=canvas.getBoundingClientRect();
    const p=screenToWorld(e.clientX-r.left,e.clientY-r.top);
    p.x=Math.round(p.x*2)/2;
    p.y=Math.round(p.y*2)/2;
    points.push(p);
  }

  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    drawingPointerId=e.pointerId;
    lastPointer={x:e.clientX,y:e.clientY};
    pointerMoved=false;
  });

  canvas.addEventListener('pointermove',e=>{
    if(drawingPointerId!==e.pointerId) return;

    const dx=e.clientX-lastPointer.x,dy=e.clientY-lastPointer.y;
    if(Math.hypot(dx,dy)>3) pointerMoved=true;
    lastPointer={x:e.clientX,y:e.clientY};

    if(pointerMoved){
      view.cx-=dx/view.scale;
      view.cy+=dy/view.scale;
      draw();
    }
  });

  canvas.addEventListener('pointerup',e=>{
    if(drawingPointerId!==e.pointerId) return;

    if(!pointerMoved){
      addShapePointFromEvent(e);
      update();
    }

    drawingPointerId=null;
    pointerMoved=false;
  });

  canvas.addEventListener('pointercancel',e=>{
    drawingPointerId=null;
    pointerMoved=false;
  });

  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=canvas.getBoundingClientRect();
    const before=screenToWorld(e.clientX-r.left,e.clientY-r.top);
    const factor=Math.exp(-e.deltaY*.001);
    view.scale=Math.max(8,Math.min(120,view.scale*factor));
    const after=screenToWorld(e.clientX-r.left,e.clientY-r.top);
    view.cx+=before.x-after.x;view.cy+=before.y-after.y;draw();
  },{passive:false});

  try {
    resizeCanvas();
    renderControls();
    update();
  } catch (err) {
    console.error(err);
    document.body.innerHTML = '<div style="font-family:system-ui;padding:40px;color:#172033"><h2>Transformation Visualizer</h2><p>The app encountered an initialization error.</p><pre style="white-space:pre-wrap;background:#f1f5f9;padding:15px;border-radius:8px">' + String(err && err.stack || err) + '</pre></div>';
  }
})();
</script>
</body>
</html>
